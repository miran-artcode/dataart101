<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>로그인 · 보는 법</title>
<meta name="description" content="분석에서 창작까지 — 데이터로 그림을 읽고, 인터랙티브 미디어아트로 재창조하는 수업 사이트." />
<link rel="stylesheet" href="css/site.css" />
<style>
  /* 로그인 — 가운데, 좁게 */
  .login-wrap { max-width: 460px; margin: 28px auto 0; }
  .login-wrap .card { padding: 22px; }
</style>
</head>
<body>
<div id="app-header"></div>

<div class="wrap narrow">
  <div class="page-head" style="text-align:center;margin:24px auto 0;max-width:none"><h1>로그인</h1></div>

  <div class="login-wrap">
    <div class="card">
      <p class="muted" style="font-size:12.5px; margin:0 0 12px">처음이면 이름과 PIN을 정하면 계정이 만들어집니다.</p>
      <div class="grid c2">
        <div><label class="field" style="margin-top:0">이름</label><input id="f-name" type="text" placeholder="실명 또는 별명" autocomplete="off" /></div>
        <div><label class="field" style="margin-top:0">반-번호 (선택)</label><input id="f-klass" type="text" placeholder="예: 2-7" autocomplete="off" /></div>
      </div>
      <div class="grid c2">
        <div><label class="field">PIN (숫자 4자리)</label><input id="f-pin" type="password" inputmode="numeric" maxlength="4" placeholder="••••" autocomplete="off" /></div>
        <div><label class="field">표시 이름 (선택)</label><input id="f-display" type="text" placeholder="비우면 이름 사용" autocomplete="off" /></div>
      </div>
      <label class="field">역할</label>
      <select id="f-role"><option value="student">학생</option><option value="teacher">교사</option></select>
      <button id="btn-login" class="btn primary wide" style="margin-top:16px">로그인</button>
      <p class="muted" style="font-size:12px; margin-top:10px; text-align:center">로그인 없이 <a href="hub.html">둘러보기</a>도 가능해요 (저장·전시는 로그인 필요).</p>
    </div>
  </div>

  <div id="privacy-note" style="max-width:620px; margin:18px auto 0"></div>
</div>

<script src="js/explain.js"></script>
<script src="js/guide.js"></script>
<script src="js/auth.js"></script>
<script src="js/ui.js"></script>
<script>
  document.getElementById('privacy-note').innerHTML = UI.callout(
    '<b>개인정보 안내</b> · PIN 4자리는 ‘실수 방지 잠금’ 수준이에요(진짜 보안 아님). 미성년자 정보이니 <b>학교 개인정보 방침</b>을 먼저 확인하고, 필요하면 표시 이름을 별명/코드로 바꾸세요.', 'warn');

  const qs = new URLSearchParams(location.search);
  const next = qs.get('next') || 'hub.html';
  function doLogin() {
    try {
      Auth.login({
        name: document.getElementById('f-name').value,
        klass: document.getElementById('f-klass').value,
        pin: document.getElementById('f-pin').value,
        display: document.getElementById('f-display').value,
        role: document.getElementById('f-role').value
      });
      location.href = next;
    } catch (e) { UI.toast(e.message); }
  }
  document.getElementById('btn-login').addEventListener('click', doLogin);
  document.getElementById('f-pin').addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });
  if (Auth.current()) UI.toast('이미 로그인되어 있어요. 상단 메뉴로 이동하세요.');
</script>
</body>
</html>
